services:
  postgres:
    image: postgres:16-alpine
    container_name: jw-talks-planner-db
    # Порт на хост не публикуем: бот ходит к БД по внутренней сети compose
    environment:
      POSTGRES_USER: jwbot
      POSTGRES_PASSWORD: jwbot
      POSTGRES_DB: jw_talks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jwbot -d jw_talks"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    image: jw-talks-planner:latest
    container_name: jw-talks-planner
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jwbot:jwbot@postgres:5432/jw_talks
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0

volumes:
  postgres-data:

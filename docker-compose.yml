services:
  postgres:
    image: postgres:16-alpine
    container_name: jw-talks-planner-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: jwbot
      POSTGRES_PASSWORD: jwbot
      POSTGRES_DB: jw_talks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jwbot -d jw_talks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
